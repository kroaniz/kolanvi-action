name: 'Kolanvi Autonomous Resilience Guard'
description: 'Autonomous cloud resilience scanner: detects Toxic Combinations in IaC/Docker and dispatches GitOps Auto-PRs.'
author: 'Kolanvi Security'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  github_token:
    description: 'GitHub Token to open auto-remediation PRs'
    required: true
    default: ${{ github.token }}
  api_url:
    description: 'Kolanvi Resilience Core API endpoint'
    required: false
    default: 'https://shieldai-action.onrender.com'
  pro_key:
    description: 'Kolanvi Enterprise Cryptographic License Token'
    required: false
    default: ''
  fail_on_critical:
    description: 'Fail the workflow if critical vulnerabilities are found'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Python 3.11 Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      shell: bash
      run: |
        pip install --no-cache-dir httpx

    - name: Execute Kolanvi Autonomous CLI
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        KOLANVI_API_URL: ${{ inputs.api_url }}
        KOLANVI_LICENSE_KEY: ${{ inputs.pro_key }}
        FAIL_ON_CRITICAL: ${{ inputs.fail_on_critical }}
        TARGET_REPO: ${{ github.repository }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
      run: |
        python3 ${{ github.action_path }}/cli.py
