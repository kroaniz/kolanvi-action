name: 'Kolanvi Autonomous Resilience Guard'
description: 'Autonomous cloud resilience scanner: detects Toxic Combinations in IaC/Docker and dispatches GitOps Auto-PRs.'
author: 'Kolanvi Security'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  github_token:
    description: 'GitHub Token (secrets.GITHUB_TOKEN or PAT) to open auto-remediation PRs'
    required: true
    default: ${{ github.token }}
  target_file:
    description: 'Path to target configuration or source file to audit'
    required: false
    default: 'main.tf'
  mode:
    description: 'Audit engine mode: terraform, dockerfile, sca, or code'
    required: false
    default: 'terraform'
  api_url:
    description: 'Kolanvi Resilience Core API endpoint'
    required: false
    default: 'https://shieldai-action.onrender.com'
  pro_key:
    description: 'Kolanvi Enterprise Cryptographic License Token'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python 3.11 Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Execute Kolanvi Autonomous CLI
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_TARGET_FILE: ${{ inputs.target_file }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_API_URL: ${{ inputs.api_url }}
        INPUT_PRO_KEY: ${{ inputs.pro_key }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        python3 ${{ github.action_path }}/cli.py
