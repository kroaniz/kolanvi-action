name: 'Kolanvi Autonomous DevSecOps & Cloud Resilience'
description: 'Autonomous SAST, SCA, Blast Radius analysis, SOC 2 compliance, and verified GitOps PR remediation.'
author: 'Kolanvi'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  github_token:
    description: 'GitHub token for pull request dispatch and review integration'
    required: false
    default: ${{ github.token }}
  kolanvi_api_key:
    description: 'Kolanvi Pro license key for unlocked remediation rules'
    required: false
    default: ''
  api_url:
    description: 'Kolanvi backend URL'
    required: false
    default: 'https://kolanvi-core.onrender.com'
  auto_pr:
    description: 'Automatically open remediation PR for verified fixes'
    required: false
    default: 'true'
  fail_on_critical:
    description: 'Block the pipeline if critical vulnerabilities are detected'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Runtime Dependencies
      shell: bash
      run: |
        python3 -m pip install --quiet --no-cache-dir httpx

    - name: Execute Kolanvi Engine
      shell: bash
      run: |
        python3 ${{ github.action_path }}/cli.py
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_PRO_KEY: ${{ inputs.kolanvi_api_key }}
        KOLANVI_LICENSE_KEY: ${{ inputs.kolanvi_api_key }}
        INPUT_API_URL: ${{ inputs.api_url }}
        KOLANVI_API_URL: ${{ inputs.api_url }}
        AUTO_PR: ${{ inputs.auto_pr }}
        FAIL_ON_CRITICAL: ${{ inputs.fail_on_critical }}
        TARGET_REPO: ${{ github.repository }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
